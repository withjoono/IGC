name: Deploy IGC Frontend

on:
  push:
    branches: [main]
    paths:
      - "IGC-Frontend/**"
      - ".github/workflows/deploy-igc.yml"
  workflow_dispatch:

# 동시 배포 방지
concurrency:
  group: deploy-igc-front
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: IGC/IGC-Frontend
    steps:
      # 필요한 시크릿이 없으면 여기서 이름을 찍고 멈춘다 (등록 방법: docs/context/deploy-and-domain.md)
      - name: Check required secrets
        working-directory: .
        env:
          SATELLITE_HEADER_DEPLOY_KEY: ${{ secrets.SATELLITE_HEADER_DEPLOY_KEY }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          missing=0
          for s in SATELLITE_HEADER_DEPLOY_KEY FIREBASE_SERVICE_ACCOUNT; do
            if [ -z "${!s}" ]; then echo "::error::GitHub secret $s is not set"; missing=1; fi
          done
          exit $missing

      - uses: actions/checkout@v4
        with:
          path: IGC

      # package.json 의 file:../../Music_College/packages/satellite-header 와 같은 디렉터리 구조.
      # Music_College 는 비공개 리포라 읽기 전용 SSH 배포 키가 필요하다. 헤더를 바꾸면 Music_College 에 푸시한 뒤 ref 를 올린다.
      - name: Checkout shared satellite header
        uses: actions/checkout@v4
        with:
          repository: withjoono/Music_College
          ref: 4773978bb1ecba67d41105478e1dc8896576d2ff
          path: Music_College
          ssh-key: ${{ secrets.SATELLITE_HEADER_DEPLOY_KEY }}
          persist-credentials: false
          sparse-checkout: packages/satellite-header

      - name: Verify shared header source
        run: test -f ../../Music_College/packages/satellite-header/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: IGC/IGC-Frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      # dist에 dev URL(localhost) 유출 차단 (Hub CLAUDE.md 권고)
      - name: Guard against localhost in bundle
        run: |
          # 포트가 붙은 것만 본다 — TanStack Router 내부 기본값 "http://localhost" 는 dev URL 이 아니다
          if grep -rqE "localhost:[0-9]+" dist/assets/*.js; then
            echo "::error::localhost leaked into production bundle"; exit 1;
          fi

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      # 가드레일: 반드시 igc 타깃만 배포 (ts-front-479305/igc-front)
      - name: Deploy to Firebase Hosting (igc only)
        run: npx firebase-tools@latest deploy --only hosting:igc --project ts-front-479305 --non-interactive
